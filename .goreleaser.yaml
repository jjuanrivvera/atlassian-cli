version: 2
project_name: atlassian-cli

before:
  hooks:
    - go mod tidy

builds:
  - id: atlassian
    main: ./cmd/atlassian
    binary: atlassian
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/jjuanrivvera/atlassian-cli/internal/version.Version={{.Version}}
      - -X github.com/jjuanrivvera/atlassian-cli/internal/version.Commit={{.ShortCommit}}
      - -X github.com/jjuanrivvera/atlassian-cli/internal/version.Date={{.Date}}

archives:
  - id: atlassian
    ids: [atlassian]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - completions/*

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch

# Homebrew CASK, not the deprecated `brews:`. `binaries:` is required because the cask is
# named atlassian-cli while the binary inside the archive is `atlassian` — without it the
# symlink points at the wrong name and `brew install` cannot find the command.
homebrew_casks:
  - name: atlassian-cli
    binaries: [atlassian]
    repository:
      owner: jjuanrivvera
      name: homebrew-atlassian-cli
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/jjuanrivvera/atlassian-cli
    description: Jira, Confluence, JSM and Agile from the command line
    license: MIT
    hooks:
      post:
        install: |
          # An unsigned binary is SIGKILLed by Gatekeeper on macOS arm64 unless the
          # quarantine attribute is stripped.
          system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/atlassian"]

scoops:
  - name: atlassian-cli
    repository:
      owner: jjuanrivvera
      name: scoop-atlassian-cli
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/jjuanrivvera/atlassian-cli
    description: Jira, Confluence, JSM and Agile from the command line
    license: MIT

nfpms:
  - id: packages
    ids: [atlassian]
    package_name: atlassian-cli
    vendor: jjuanrivvera
    homepage: https://github.com/jjuanrivvera/atlassian-cli
    maintainer: Juan Rivera <jjuanrivvera@gmail.com>
    description: Jira, Confluence, Jira Service Management and Jira Software from the command line
    license: MIT
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    contents:
      - src: ./completions/atlassian.bash
        dst: /usr/share/bash-completion/completions/atlassian
        file_info: {mode: 0644}
      - src: ./completions/atlassian.zsh
        dst: /usr/share/zsh/site-functions/_atlassian
        file_info: {mode: 0644}
      - src: ./completions/atlassian.fish
        dst: /usr/share/fish/vendor_completions.d/atlassian.fish
        file_info: {mode: 0644}

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

release:
  draft: false
  prerelease: auto
  footer: |
    ---
    Install: `curl -fsSL https://raw.githubusercontent.com/jjuanrivvera/atlassian-cli/main/install.sh | sh`
